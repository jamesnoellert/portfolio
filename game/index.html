<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FPS P2P Test (4 players)</title>
<style>
  body { margin:0; overflow:hidden; font-family:system-ui, sans-serif; background:#000; color:#fff; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:rgba(0,0,0,.8); z-index:2; text-align:center; }
  .overlay h1 { margin:0 0 8px; font-size:44px; letter-spacing:2px; }
  .overlay input, .overlay button { font-size:18px; padding:8px 14px; }
  .big { font-size:22px !important; padding:14px 28px !important; min-width:240px; }
  .row { display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .dim { opacity:.65; font-size:14px; }
  [hidden] { display:none !important; }
  #code { font-size:40px; font-weight:bold; letter-spacing:5px; user-select:all; }
  #lobbyStatus { min-height:24px; font-size:18px; }
  #cross { position:fixed; left:50%; top:50%; width:6px; height:6px; margin:-3px; background:#fff; border-radius:50%; z-index:1; }
  #status { position:fixed; top:10px; left:10px; z-index:1; font-size:16px; text-shadow:0 1px 2px #000; }
  #mic { position:fixed; top:10px; right:12px; z-index:1; font-size:16px; text-shadow:0 1px 2px #000; }
  #hud { position:fixed; bottom:16px; left:16px; z-index:1; font-size:22px; font-weight:bold; text-shadow:0 1px 3px #000; }
  #ammo { margin:8px 0 6px; height:20px; }
  #ammo span { display:inline-block; width:8px; height:20px; margin-right:4px; border-radius:2px; background:#ffe066; box-shadow:0 1px 2px #000; }
  #ammo span.empty { background:rgba(255,255,255,.18); }
  #reload { position:fixed; left:50%; top:58%; transform:translateX(-50%); z-index:1; text-align:center; display:none; text-shadow:0 1px 3px #000; font-weight:bold; letter-spacing:2px; }
  #reloadBar { width:160px; height:6px; margin-top:6px; background:rgba(255,255,255,.25); border-radius:3px; overflow:hidden; }
  #reloadFill { height:100%; width:0; background:#ffe066; }
  #score { margin-top:8px; font-size:17px; line-height:1.35; }
  #hp span { display:inline-block; width:22px; height:22px; margin-right:4px; border:2px solid #fff; border-radius:3px; }
  #msg { position:fixed; top:22%; left:0; right:0; text-align:center; font-size:40px; font-weight:bold; z-index:1; text-shadow:0 2px 6px #000; opacity:0; transition:opacity .4s; pointer-events:none; }
  #flash { position:fixed; inset:0; background:red; opacity:0; pointer-events:none; z-index:1; }
  #over { display:none; }
  #over h1 { font-size:56px; }
</style>

<body>
<div id="ui" class="overlay">
  <h1>FPS TEST</h1>

  <div id="menu" class="row">
    <button id="hostBtn" class="big">Host a game</button>
    <button id="joinMenuBtn" class="big">Join a game</button>
  </div>

  <div id="hostPanel" hidden>
    <div>Give this code to the other players (up to 3 more)</div>
    <div id="code">…</div>
    <div class="dim" style="margin-top:12px">Custom level (optional — sent to the other players automatically)</div>
    <input id="levelFile" type="file" accept=".glb" style="font-size:14px">
  </div>

  <div id="joinPanel" hidden class="row">
    <input id="join" placeholder="host's code" size="8">
    <button id="joinBtn">Join</button>
  </div>

  <div id="lobbyStatus"></div>
  <button id="play" class="big" hidden>▶ Play</button>
  <div class="dim">WASD move · Shift run · Space jump · mouse aim · click shoot · R reload · M mute mic · Esc pause</div>
</div>

<div id="over" class="overlay">
  <h1 id="overTitle"></h1>
  <div id="overScore" style="font-size:24px"></div>
  <button id="again" class="big">Play again</button>
</div>

<div id="cross"></div>
<div id="status"></div>
<div id="mic"></div>
<div id="hud"><div id="hp"></div><div id="ammo"></div><div id="score"></div></div>
<div id="reload"><div id="reloadLabel">RELOADING</div><div id="reloadBar"><div id="reloadFill"></div></div></div>
<div id="msg"></div>
<div id="flash"></div>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Octree } from 'three/addons/math/Octree.js';
import { Capsule } from 'three/addons/math/Capsule.js';

const $ = id => document.getElementById(id);
const HP_MAX = 5, KILLS_TO_WIN = 5, MAX_PLAYERS = 4;
const COLORS = [0x3fcf4f, 0xffd12e, 0x3fa9ff, 0xff5fa2];
const NAMES = ['Green', 'Yellow', 'Blue', 'Pink'];
let mode = null;            // 'host' or 'join'
let mySlot = 0;             // 0 = host, 1–3 = guests
let myColor = COLORS[0];
let hp = HP_MAX, gameOver = false;
let scores = [0, 0, 0, 0];  // defeats per slot (the host keeps the official copy)
let present = [false, false, false, false]; // which slots are in the game right now

// ---------- Scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b5d9);
scene.fog = new THREE.Fog(0x87b5d9, 20, 90);
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 300);
scene.add(camera);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Lighting: simple sky/ground fill plus a sun (lighting will be baked into the level later)
scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x4a4030, 1.0));
const sun = new THREE.DirectionalLight(0xfff1dd, 2.2);
sun.position.set(0.6, 1, 0.35);
scene.add(sun);

// Default level: seeded random boxes so every computer builds the same one
let seed = 42; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const defaultLevel = new THREE.Group(); scene.add(defaultLevel);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x6a8f5a }));
floor.rotation.x = -Math.PI / 2; defaultLevel.add(floor);
for (let i = 0; i < 30; i++) {
  const h = 1 + rnd() * 3;
  const b = new THREE.Mesh(new THREE.BoxGeometry(2, h, 2), new THREE.MeshStandardMaterial({ color: 0x997755 }));
  b.position.set((rnd() - .5) * 70, h / 2, (rnd() - .5) * 70);
  defaultLevel.add(b);
}
let levelRoot = defaultLevel;
let spawnPoints = [];
let hostLevelBuf = null; // host keeps the raw .glb so it can send it to joiners

// ---------- Collision: the level's own geometry ----------
let worldOctree;
function buildCollision() {
  levelRoot.updateMatrixWorld(true);
  worldOctree = new Octree();
  worldOctree.fromGraphNode(levelRoot);
}
buildCollision();

const GRAVITY = 30;
const playerCollider = new Capsule(new THREE.Vector3(0, 0.35, 0), new THREE.Vector3(0, 1.45, 0), 0.35);
const playerVelocity = new THREE.Vector3();
let onFloor = false;

function playerCollisions() {
  const r = worldOctree.capsuleIntersect(playerCollider);
  onFloor = false;
  if (r) {
    onFloor = r.normal.y > 0.5;
    if (!onFloor) playerVelocity.addScaledVector(r.normal, -r.normal.dot(playerVelocity));
    if (r.depth >= 1e-10) playerCollider.translate(r.normal.multiplyScalar(r.depth));
  }
}
function updatePlayer(dt) {
  let damping = Math.exp(-4 * dt) - 1;
  if (!onFloor) { playerVelocity.y -= GRAVITY * dt; damping *= 0.1; }
  playerVelocity.addScaledVector(playerVelocity, damping);
  playerCollider.translate(playerVelocity.clone().multiplyScalar(dt));
  playerCollisions();
  camera.position.copy(playerCollider.end); camera.position.y += 0.15;
}
const fwd = new THREE.Vector3(), side = new THREE.Vector3();
function playerInput(dt) {
  if (!controls.isLocked || gameOver) return;
  const accel = dt * (onFloor ? (keys.ShiftLeft ? 40 : 25) : 8);
  camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
  side.crossVectors(fwd, camera.up);
  if (keys.KeyW) playerVelocity.addScaledVector(fwd, accel);
  if (keys.KeyS) playerVelocity.addScaledVector(fwd, -accel);
  if (keys.KeyD) playerVelocity.addScaledVector(side, accel);
  if (keys.KeyA) playerVelocity.addScaledVector(side, -accel);
  if (onFloor && keys.Space) playerVelocity.y = 9;
}

// ---------- Level loading ----------
function applyLevel(buf) {
  new GLTFLoader().parse(buf, '', gltf => {
    scene.remove(levelRoot);
    levelRoot = gltf.scene; scene.add(levelRoot);
    levelRoot.updateMatrixWorld(true);
    spawnPoints = [];
    levelRoot.traverse(o => { if (/^spawn/i.test(o.name)) spawnPoints.push(o.getWorldPosition(new THREE.Vector3())); });
    buildCollision();
    spawn();
    message('Level loaded');
    levelDone();
  }, err => { lobby('Level failed to load: ' + err.message); levelDone(); });
}
// Load the site's level for everyone. Every player fetches the same file, so
// the shared id means nobody needs it sent over the network.
const SITE_LEVEL = '/game/level_v6.glb';
fetch(SITE_LEVEL).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).then(buf => {
  if (hostLevelId || haveLevelId) return; // a custom level, or one from the host, got here first
  hostLevelBuf = buf; hostLevelId = haveLevelId = SITE_LEVEL;
  applyLevel(buf);
}).catch(err => console.warn('Site level failed to load:', err));
$('levelFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  hostLevelBuf = await f.arrayBuffer();
  hostLevelId = Date.now();
  applyLevel(hostLevelBuf);
  for (const g of guests.values()) if (g.linked) sendLevel(g); // anyone already connected
};

// ---------- Other players (avatars) ----------
// The character model is embedded in this file (CHAR_GLB_B64, near the top).
// Its origin is at the feet; each avatar group is placed at that player's feet.
const CHAR_SCALE = 1; // multiplier on the model's own size (currently ~1.72 m tall)
let charTemplate = null;
const avatars = new Map(); // slot -> { group, target, yaw, seen }
{
  const bin = Uint8Array.from(atob(window.CHAR_GLB_B64), ch => ch.charCodeAt(0));
  new GLTFLoader().parse(bin.buffer, '', gltf => {
    charTemplate = gltf.scene;
    charTemplate.rotation.y = Math.PI; // Blender's front view faces +Z here; turn it to face the aim direction
    charTemplate.scale.setScalar(CHAR_SCALE);
    for (const a of avatars.values()) a.group.add(charTemplate.clone());
  }, err => console.warn('Character failed to load', err));
}
function getAvatar(slot) {
  let a = avatars.get(slot);
  if (!a) {
    const group = new THREE.Group();
    group.userData.slot = slot; group.visible = false;
    if (charTemplate) group.add(charTemplate.clone());
    scene.add(group);
    a = { group, target: new THREE.Vector3(), yaw: 0, seen: false };
    avatars.set(slot, a);
  }
  return a;
}
function removeAvatar(slot) {
  const a = avatars.get(slot);
  if (a) { scene.remove(a.group); avatars.delete(slot); }
}
function syncAvatars() {
  for (let s = 0; s < MAX_PLAYERS; s++) {
    if (s !== mySlot && present[s]) getAvatar(s); else removeAvatar(s);
  }
}
// Which player (slot) does this mesh belong to? -1 if none
function slotOf(o) {
  while (o) { if (o.userData && o.userData.slot !== undefined) return o.userData.slot; o = o.parent; }
  return -1;
}
function setRemotePos(slot, p, yaw) {
  if (slot === mySlot || !present[slot]) return;
  const a = getAvatar(slot);
  a.target.fromArray(p); a.target.y -= 1.6; // eye height -> feet
  a.yaw = yaw;
  if (!a.seen) { a.group.position.copy(a.target); a.seen = true; }
}
function flinch(slot) {
  const a = avatars.get(slot); if (!a) return;
  a.group.scale.setScalar(0.9); setTimeout(() => a.group.scale.setScalar(1), 80);
}

// My gun (first-person, stuck to the camera)
const gunMat = new THREE.MeshStandardMaterial({ color: myColor });
const gun = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.5), gunMat);
gun.position.set(0.22, -0.2, -0.45); camera.add(gun);

function setMySlot(s) { mySlot = s; myColor = COLORS[s]; present[s] = true; gunMat.color.set(myColor); syncAvatars(); updateHud(); }

function spawn() {
  const p = spawnPoints.length
    ? spawnPoints[Math.floor(Math.random() * spawnPoints.length)].clone()
    : new THREE.Vector3((Math.random() - .5) * 40, levelRoot === defaultLevel ? 0 : 3, (Math.random() - .5) * 40);
  playerCollider.start.set(p.x, p.y + 0.35, p.z);
  playerCollider.end.set(p.x, p.y + 1.45, p.z);
  playerVelocity.set(0, 0, 0);
  camera.position.copy(playerCollider.end); camera.position.y += 0.15;
}

// ---------- Sound effects (synthesized, no audio files) ----------
let actx = null, noiseBuf = null;
function sfx() {
  if (!actx) {
    actx = new AudioContext();
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f0, f1, dur, type = 'sine', vol = 0.3, delay = 0) {
  const c = sfx(), t = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(c.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, freq0, freq1, vol) {
  const c = sfx(), t = c.currentTime;
  const s = c.createBufferSource(); s.buffer = noiseBuf;
  const f = c.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(freq0, t); f.frequency.exponentialRampToValueAtTime(freq1, t + dur);
  const g = c.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(c.destination);
  s.start(t); s.stop(t + dur + 0.02);
}
const sndShoot = (v = 1) => { noise(0.16, 5000, 300, 0.45 * v); tone(160, 45, 0.12, 'sine', 0.55 * v); };
const sndHitMarker = () => tone(1700, 1500, 0.06, 'square', 0.12);          // you hit someone
const sndHurt = () => { tone(240, 90, 0.2, 'sawtooth', 0.22); noise(0.1, 1200, 200, 0.3); }; // you got hit
const sndDefeated = () => [440, 330, 220, 147].forEach((f, i) => tone(f, f * 0.97, 0.22, 'triangle', 0.3, i * 0.13));
const sndScored = () => [523, 659, 784].forEach((f, i) => tone(f, f, 0.14, 'triangle', 0.25, i * 0.09));
const sndEmpty = () => tone(900, 700, 0.04, 'square', 0.1);
const sndReloadStart = () => { noise(0.06, 3000, 800, 0.25); tone(300, 200, 0.08, 'square', 0.12, 0.05); };
const sndReloadEnd = () => { noise(0.05, 4000, 1500, 0.3); tone(500, 700, 0.07, 'square', 0.14, 0.04); };
const sndWin = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.3, 'triangle', 0.25, i * 0.15));

// ---------- Shooting ----------
const ray = new THREE.Raycaster();
// Lasers are thin cylinders (browsers ignore line thickness for plain lines)
const TRACER_RADIUS = 0.025;
const tracerGeo = new THREE.CylinderGeometry(1, 1, 1, 6, 1, true);
tracerGeo.translate(0, 0.5, 0); tracerGeo.rotateX(Math.PI / 2); // unit length along +Z, starting at origin
function tracer(a, b, color) {
  const m = new THREE.Mesh(tracerGeo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 }));
  m.position.copy(a);
  m.lookAt(b);
  m.scale.set(TRACER_RADIUS, TRACER_RADIUS, a.distanceTo(b));
  scene.add(m);
  setTimeout(() => { scene.remove(m); m.material.dispose(); }, 90);
}
// Someone else's shot: draw it in their color, quieter when far away
function shotFx(slot, a, b) {
  const va = new THREE.Vector3().fromArray(a);
  tracer(va, new THREE.Vector3().fromArray(b), COLORS[slot] ?? 0xffffff);
  sndShoot(Math.max(0.08, 0.6 - camera.position.distanceTo(va) / 60));
}

// ---------- Ammo ----------
const AMMO_MAX = 6, RELOAD_MS = 4000;
let ammo = AMMO_MAX, reloadingUntil = 0;
function updateAmmo() {
  $('ammo').innerHTML = Array.from({ length: AMMO_MAX }, (_, i) => `<span class="${i < ammo ? '' : 'empty'}"></span>`).join('');
}
function startReload() {
  if (reloadingUntil || ammo === AMMO_MAX || gameOver) return;
  reloadingUntil = performance.now() + RELOAD_MS;
  sndReloadStart();
  $('reload').style.display = 'block';
}
function finishReload() {
  reloadingUntil = 0; ammo = AMMO_MAX; updateAmmo();
  $('reload').style.display = 'none';
  sndReloadEnd();
}
function cancelReload() { reloadingUntil = 0; $('reload').style.display = 'none'; }
function refillAmmo() { cancelReload(); ammo = AMMO_MAX; updateAmmo(); }
function updateReload() { // called every frame
  if (!reloadingUntil) { gun.position.y += (-0.2 - gun.position.y) * 0.3; return; }
  const left = reloadingUntil - performance.now();
  $('reloadFill').style.width = (100 * (1 - left / RELOAD_MS)) + '%';
  gun.position.y += (-0.45 - gun.position.y) * 0.2; // gun dips down while reloading
  if (left <= 0) finishReload();
}
updateAmmo();

addEventListener('mousedown', () => {
  if (!controls.isLocked || gameOver) return;
  if (reloadingUntil) { sndEmpty(); return; }
  if (ammo <= 0) { sndEmpty(); startReload(); return; }
  ammo--; updateAmmo();
  if (ammo === 0) setTimeout(startReload, 250); // auto-reload when empty
  ray.setFromCamera(new THREE.Vector2(0, 0), camera);
  const targets = [levelRoot];
  for (const a of avatars.values()) if (a.group.visible) targets.push(a.group);
  const hit = ray.intersectObjects(targets, true)[0];
  const end = hit ? hit.point : camera.position.clone().add(ray.ray.direction.clone().multiplyScalar(100));
  const start = gun.getWorldPosition(new THREE.Vector3());
  tracer(start, end, myColor);
  sndShoot();
  gun.position.z = -0.38; setTimeout(() => gun.position.z = -0.45, 60);
  netShot(start.toArray(), end.toArray());
  const target = hit ? slotOf(hit.object) : -1;
  if (target >= 0) { netHit(target); sndHitMarker(); flinch(target); }
});

// ---------- Game rules ----------
// Each player tracks their own health. When it reaches zero they report
// who defeated them; the host updates the scoreboard and tells everyone.
function takeHit(by) {
  if (gameOver || mode === null) return;
  hp--; flash('red', .4);
  if (hp > 0) sndHurt();
  else {
    hp = HP_MAX;
    message(`${NAMES[by] ?? 'Someone'} defeated you`); flash('black', .9); sndDefeated();
    spawn(); refillAmmo();
    if (mode === 'host') recordDefeat(0, by); else sendHost({ t: 'died', by });
  }
  updateHud();
}
// Host only: apply a defeat and broadcast the new scores
function recordDefeat(victim, killer) {
  if (gameOver) return;
  if (killer >= 0 && killer < MAX_PLAYERS && killer !== victim) scores[killer]++;
  broadcast({ t: 'score', scores, k: killer, v: victim });
  applyScore(scores, killer, victim);
}
function applyScore(newScores, k, v) {
  scores = newScores.slice();
  updateHud();
  if (k === mySlot) { message(`You defeated ${NAMES[v]}!`); sndScored(); }
  else if (v !== mySlot && NAMES[k] && NAMES[v]) message(`${NAMES[k]} defeated ${NAMES[v]}`);
  checkWin();
}
function checkWin() {
  const w = scores.findIndex(x => x >= KILLS_TO_WIN);
  if (w < 0 || gameOver) return;
  gameOver = true;
  controls.unlock();
  const win = w === mySlot;
  setTimeout(win ? sndWin : sndDefeated, 400);
  $('overTitle').textContent = win ? 'You win!' : `${NAMES[w]} wins`;
  $('overTitle').style.color = hex(COLORS[w]);
  let list = '';
  [0, 1, 2, 3].filter(s => present[s] || s === mySlot).sort((a, b) => scores[b] - scores[a])
    .forEach(s => list += `<div style="color:${hex(COLORS[s])}">${NAMES[s]}${s === mySlot ? ' (you)' : ''}: ${scores[s]}</div>`);
  $('overScore').innerHTML = list;
  $('over').style.display = 'flex';
  ui.style.display = 'none';
}
function resetLocal() {
  scores = [0, 0, 0, 0]; hp = HP_MAX; gameOver = false; refillAmmo();
  $('over').style.display = 'none';
  spawn(); updateHud();
  ui.style.display = controls.isLocked ? 'none' : 'flex';
}
function doReset() { resetLocal(); broadcast({ t: 'reset' }); } // host only
$('again').onclick = () => {
  if (mode === 'host') doReset(); else { sendHost({ t: 'reset' }); resetLocal(); }
  controls.lock();
};

// ---------- Voice chat (everyone hears everyone) ----------
let localStream = null, micOn = true, hasMic = false;
const calls = new Map(); // other player's peer id -> { call, audio, t }
let voicePeers = [];    // peer ids of everyone else currently in the game
async function getMic() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    hasMic = true;
  } catch (e) {
    // No mic (or permission denied): send silence so we can still hear the others
    localStream = new AudioContext().createMediaStreamDestination().stream;
    hasMic = false;
  }
  updateMic();
}
function toggleMic() {
  if (!hasMic) return;
  micOn = !micOn;
  localStream.getAudioTracks().forEach(t => t.enabled = micOn);
  updateMic();
}
function updateMic() {
  $('mic').textContent = !hasMic ? '🎤 no mic' : micOn ? '🎤 mic on (M to mute)' : '🔇 muted (M to unmute)';
}
function closeCall(pid) {
  const c = calls.get(pid); if (!c) return;
  try { c.call.close(); } catch {}
  c.audio.srcObject = null; calls.delete(pid);
}
function addCall(call) {
  if (!call) return;
  if (calls.has(call.peer) && calls.get(call.peer).call !== call) closeCall(call.peer);
  const audio = new Audio(); audio.autoplay = true;
  calls.set(call.peer, { call, audio, t: performance.now() });
  call.on('stream', st => { audio.srcObject = st; audio.play().catch(() => {}); });
  call.on('close', () => { const c = calls.get(call.peer); if (c && c.call === call) closeCall(call.peer); });
  call.on('error', () => {});
}
// Make sure we have a voice link with each other player. For each pair,
// the one with the "smaller" peer id places the call; the other answers.
function updateVoice(peerIds = voicePeers) {
  voicePeers = peerIds;
  for (const [pid, c] of calls) {
    const stale = !c.call.open && performance.now() - c.t > 15000;
    if (!peerIds.includes(pid) || stale) closeCall(pid);
  }
  if (!localStream) return;
  for (const pid of peerIds) if (!calls.has(pid) && peer.id < pid) addCall(peer.call(pid, localStream));
}

// ---------- Networking (PeerJS) ----------
// Star layout: every guest connects only to the host. The host relays
// movement and shots to everyone else and keeps the official scoreboard.
// Each connection has two channels: "main" (guaranteed delivery, for game
// events) and "pos" (fast, may drop packets, for movement updates).
const code = Math.random().toString(36).slice(2, 7).toUpperCase();
const peer = new Peer('fps-test-' + code);
var hostLevelId = 0, haveLevelId = 0;
let everLinked = false;
peer.on('open', () => $('code').textContent = code);
peer.on('error', e => {
  if (e.type === 'peer-unavailable') {
    if (mode !== 'join' || everLinked) return; // mid-game blip: keep retrying quietly
    retrying = false; $('joinBtn').disabled = false; lobby('No game found with that code. Check it and try again.');
  }
  else if (e.type !== 'network' && e.type !== 'server-error') lobby('Error: ' + e.type);
});
// The matchmaking server connection can drop on its own; reconnect so
// players can still find each other (the game itself keeps running).
peer.on('disconnected', () => { setTimeout(() => { if (!peer.destroyed && peer.disconnected) peer.reconnect(); }, 1000); });
peer.on('call', call => { if (!mode) return; call.answer(localStream); addCall(call); });
peer.on('connection', c => {
  if (mode !== 'host') { c.close(); return; }
  if (c.label === 'pos') hostAttachPos(c); else hostAccept(c);
});

// ===== HOST =====
const guests = new Map(); // token -> { token, slot, conn, posConn, peerId, linked, lastHeard, graceUntil }
const linkedGuests = () => [...guests.values()].filter(g => g.linked);
const guestBySlot = s => linkedGuests().find(g => g.slot === s);
const guestOfConn = c => [...guests.values()].find(g => g.conn === c);
function sendG(g, msg) { if (g.conn && g.conn.open) g.conn.send(msg); }
function sendPos(g, msg) { if (g.posConn && g.posConn.open) g.posConn.send(msg); else sendG(g, msg); }
function broadcast(msg, exceptSlot = -1) { if (mode === 'host') for (const g of linkedGuests()) if (g.slot !== exceptSlot) sendG(g, msg); }
function hostLobby() {
  const n = linkedGuests().length;
  lobby(n ? `${n + 1} players in game — you are ${NAMES[mySlot]}` : 'Waiting for players to join… (up to 3)');
}

function hostAccept(c) {
  c.on('open', () => {
    c.send({ t: 'hb' });
    const pc = c.peerConnection;
    if (pc) pc.addEventListener('iceconnectionstatechange', () => {
      const g = guestOfConn(c);
      if (g && pc.iceConnectionState === 'failed') hostDrop(g, 'network link failed');
    });
  });
  c.on('data', m => {
    if (m && m.t === 'hello') return hostHello(c, m);
    const g = guestOfConn(c); if (!g || !g.linked) return;
    g.lastHeard = performance.now();
    fromGuest(g, m);
  });
  c.on('close', () => { const g = guestOfConn(c); if (g) hostDrop(g, 'connection closed'); });
  c.on('error', () => {});
}

function hostHello(c, m) {
  let g = guests.get(m.token);
  if (g) {
    // A returning player: same color, same score
    if (g.conn && g.conn !== c) { const old = g.conn; g.conn = null; try { old.close(); } catch {} }
  } else {
    // A new player: find a free slot (reusing one whose player is gone, if needed)
    const taken = new Set(linkedGuests().map(x => x.slot));
    let slot = -1;
    for (let s = 1; s < MAX_PLAYERS && slot < 0; s++) if (!taken.has(s) && ![...guests.values()].some(x => x.slot === s)) slot = s;
    for (let s = 1; s < MAX_PLAYERS && slot < 0; s++) if (!taken.has(s)) slot = s;
    if (slot < 0) { c.send({ t: 'full' }); setTimeout(() => c.close(), 500); return; }
    for (const [tk, old] of guests) if (old.slot === slot) guests.delete(tk);
    scores[slot] = 0;
    g = { token: m.token, slot };
    guests.set(m.token, g);
  }
  Object.assign(g, { conn: c, peerId: c.peer, linked: true, lastHeard: performance.now(), graceUntil: 0 });
  present[g.slot] = true;
  c.send({ t: 'welcome', slot: g.slot, lvl: hostLevelId });
  broadcastRoster();
  message(`${NAMES[g.slot]} joined`);
  hostLobby();
}

function hostAttachPos(c) {
  c.on('data', m => {
    const g = linkedGuests().find(x => x.peerId === c.peer);
    if (!g) return;
    if (g.posConn !== c) { if (g.posConn) try { g.posConn.close(); } catch {} g.posConn = c; }
    g.lastHeard = performance.now();
    if (m && m.t === 'p') guestMoved(g, m);
  });
}

function guestMoved(g, m) {
  setRemotePos(g.slot, m.p, m.y);
  const msg = { t: 'p', s: g.slot, p: m.p, y: m.y };
  for (const o of linkedGuests()) if (o !== g) sendPos(o, msg);
}

function fromGuest(g, m) {
  switch (m.t) {
    case 'p': guestMoved(g, m); break;
    case 'shot': shotFx(g.slot, m.a, m.b); broadcast({ t: 'shot', s: g.slot, a: m.a, b: m.b }, g.slot); break;
    case 'hit':
      if (m.target === 0) takeHit(g.slot);
      else { const t = guestBySlot(m.target); if (t) sendG(t, { t: 'hit', by: g.slot }); }
      break;
    case 'died': recordDefeat(g.slot, m.by); break;
    case 'reset': doReset(); break;
    case 'needlvl': sendLevel(g); break;
    case 'lvlok': g.graceUntil = 0; g.lastHeard = performance.now(); break;
  }
}

function broadcastRoster() {
  const players = [{ s: 0, peer: peer.id }, ...linkedGuests().map(g => ({ s: g.slot, peer: g.peerId }))];
  broadcast({ t: 'roster', players, scores });
  applyRoster(players, scores);
}

function hostDrop(g, reason) {
  if (!g.linked) return;
  g.linked = false;
  try { g.conn && g.conn.close(); } catch {}
  try { g.posConn && g.posConn.close(); } catch {}
  g.conn = null; g.posConn = null;
  present[g.slot] = false;
  console.log(`${NAMES[g.slot]} dropped:`, reason);
  message(`${NAMES[g.slot]} left (${reason})`, 2000);
  broadcastRoster(); // their score is kept in case they rejoin
  hostLobby();
}

// ===== GUEST =====
let hostConn = null, hostPos = null, linked = false, lastHeard = 0;
let hostCode = null, retrying = false, attempts = 0;
const myToken = Math.random().toString(36).slice(2); // identifies me if I reconnect
function sendHost(msg) { if (hostConn && hostConn.open) hostConn.send(msg); }

function connectToHost() {
  if (!retrying) return;
  attempts++;
  guestSetup(peer.connect('fps-test-' + hostCode, { reliable: true, label: 'main' }));
}

function guestSetup(c) {
  if (hostConn && hostConn !== c) try { hostConn.close(); } catch {}
  hostConn = c; linked = false;
  lobby(attempts > 1 ? `Reconnecting… (try ${attempts})` : 'Connecting…');
  const timer = setTimeout(() => { if (hostConn === c && !linked) guestDropped('could not connect'); }, 10000);
  c.on('open', () => {
    if (hostConn !== c) return;
    lastHeard = performance.now();
    c.send({ t: 'hello', token: myToken });
    const pc = c.peerConnection;
    if (pc) pc.addEventListener('iceconnectionstatechange', () => {
      if (hostConn === c && pc.iceConnectionState === 'failed') guestDropped('network link failed');
    });
    if (hostPos) try { hostPos.close(); } catch {}
    const pos = hostPos = peer.connect(c.peer, { reliable: false, serialization: 'json', label: 'pos' });
    pos.on('data', m => {
      if (hostPos !== pos || hostConn !== c) return;
      lastHeard = performance.now();
      if (m && m.t === 'p') fromHost(m);
    });
  });
  c.on('data', m => {
    if (hostConn !== c) return;
    lastHeard = performance.now();
    if (m.t === 'welcome' || m.t === 'full') clearTimeout(timer);
    fromHost(m);
  });
  c.on('close', () => { if (hostConn === c) guestDropped('connection closed'); });
  c.on('error', () => {});
}

function fromHost(m) {
  switch (m.t) {
    case 'welcome': {
      const rejoin = everLinked;
      linked = true; everLinked = true; attempts = 0;
      setMySlot(m.slot);
      lobby(`${rejoin ? 'Reconnected' : 'Connected'} — you are ${NAMES[mySlot]}`);
      $('play').hidden = false; $('play').textContent = '▶ Play';
      $('joinPanel').hidden = true;
      if (m.lvl && m.lvl !== haveLevelId) sendHost({ t: 'needlvl' });
      break;
    }
    case 'full':
      retrying = false; $('joinBtn').disabled = false;
      lobby('That game is full (4 players max).');
      break;
    case 'roster': applyRoster(m.players, m.scores); break;
    case 'p': setRemotePos(m.s, m.p, m.y); break;
    case 'shot': shotFx(m.s, m.a, m.b); break;
    case 'hit': takeHit(m.by); break;
    case 'score': applyScore(m.scores, m.k, m.v); break;
    case 'reset': resetLocal(); break;
    case 'lvl0': graceUntil = performance.now() + 60000; incoming = { id: m.id, n: m.n, parts: new Array(m.n), got: 0 }; message('Receiving level…'); break;
    case 'lvlc': receiveChunk(m); break;
  }
}

function guestDropped(reason) {
  const old = hostConn, oldPos = hostPos;
  hostConn = null; hostPos = null; linked = false;
  try { old && old.close(); } catch {}
  try { oldPos && oldPos.close(); } catch {}
  present = present.map((_, s) => s === mySlot);
  syncAvatars();
  console.log('Dropped:', reason);
  if (retrying) { lobby(`Lost connection (${reason}) — reconnecting…`); setTimeout(connectToHost, 1000); }
}

// ===== Shared =====
function applyRoster(players, sc) {
  present = [false, false, false, false];
  for (const p of players) present[p.s] = true;
  present[mySlot] = true;
  scores = sc.slice();
  syncAvatars(); updateHud();
  updateVoice(players.filter(p => p.s !== mySlot).map(p => p.peer));
}

// Menu
$('hostBtn').onclick = async () => {
  mode = 'host'; setMySlot(0); await getMic();
  $('menu').hidden = true; $('hostPanel').hidden = false; $('play').hidden = false;
  $('play').textContent = '▶ Play';
  hostLobby();
};
$('joinMenuBtn').onclick = async () => {
  mode = 'join'; await getMic();
  $('menu').hidden = true; $('joinPanel').hidden = false; $('join').focus();
};
$('joinBtn').onclick = () => {
  const c = $('join').value.trim().toUpperCase();
  if (!c || $('joinBtn').disabled) return;
  hostCode = c; retrying = true; attempts = 0;
  $('joinBtn').disabled = true; // no double-joins
  connectToHost();
};
$('join').onkeydown = e => { if (e.key === 'Enter') $('joinBtn').click(); };

// Heartbeats: a tiny "still here" every second on the main channel,
// so a dead link is noticed quickly even when nothing else is being sent.
setInterval(() => {
  if (mode === 'host') broadcast({ t: 'hb' });
  else if (mode === 'join') sendHost({ t: 'hb' });
}, 1000);

// Watchdog: guests reconnect after 6 s of silence (score is kept);
// the host drops a silent guest after 10 s. Paused while a level loads.
let graceUntil = 0, hiccup = false;
setInterval(() => {
  const now = performance.now();
  if (mode === 'host') {
    for (const g of linkedGuests()) if (now > g.graceUntil && now - g.lastHeard > 10000) hostDrop(g, 'no response');
  } else if (mode === 'join' && hostConn && linked && now > graceUntil) {
    const quiet = now - lastHeard;
    if (quiet > 6000) { hiccup = false; guestDropped('no response'); }
    else if (quiet > 2500 && !hiccup) { hiccup = true; $('status').textContent = 'Connection hiccup… waiting'; }
    else if (quiet < 1000 && hiccup) { hiccup = false; $('status').textContent = `Connected — you are ${NAMES[mySlot]}`; }
  }
  if (mode) updateVoice(); // retry missing voice links, tidy up dead ones
}, 500);

// Called when a level finishes loading (or fails)
function levelDone() {
  lastHeard = performance.now();
  if (mode === 'join') { graceUntil = 0; sendHost({ t: 'lvlok' }); }
  if (mode === 'host') for (const g of linkedGuests()) g.lastHeard = performance.now();
}

// Host: send the level in small pieces so the connection doesn't overflow
const CHUNK = 16000;
async function sendLevel(g) {
  const c = g.conn;
  if (!hostLevelBuf || !c || !c.open) return;
  const bytes = new Uint8Array(hostLevelBuf), n = Math.ceil(bytes.length / CHUNK), id = hostLevelId;
  g.graceUntil = performance.now() + 60000; // until they say "lvlok"
  c.send({ t: 'lvl0', id, n });
  for (let i = 0; i < n; i++) {
    while (c.open && ((c.bufferSize || 0) > 8 || (c.dataChannel && c.dataChannel.bufferedAmount > 256 * 1024)))
      await new Promise(r => setTimeout(r, 15));
    if (g.conn !== c || !c.open) return;
    c.send({ t: 'lvlc', id, i, d: bytes.slice(i * CHUNK, (i + 1) * CHUNK) });
  }
}
// Guest: reassemble the level
let incoming = null;
async function receiveChunk(m) {
  if (!incoming || incoming.id !== m.id) return;
  incoming.parts[m.i] = new Uint8Array(await toArrayBuffer(m.d));
  incoming.got++;
  if (incoming.got % 20 === 0) message(`Receiving level… ${Math.round(100 * incoming.got / incoming.n)}%`, 800);
  if (incoming.got === incoming.n) {
    const total = incoming.parts.reduce((s, p) => s + p.length, 0);
    const all = new Uint8Array(total); let off = 0;
    for (const p of incoming.parts) { all.set(p, off); off += p.length; }
    haveLevelId = incoming.id;
    incoming = null;
    applyLevel(all.buffer);
  }
}
async function toArrayBuffer(d) {
  if (d instanceof ArrayBuffer) return d;
  if (ArrayBuffer.isView(d)) return d.buffer.slice(d.byteOffset, d.byteOffset + d.byteLength);
  if (d instanceof Blob) return await d.arrayBuffer();
  return d;
}

// Shots and hits
function netShot(a, b) {
  if (mode === 'host') broadcast({ t: 'shot', s: 0, a, b });
  else sendHost({ t: 'shot', a, b });
}
function netHit(target) {
  if (mode === 'host') { const g = guestBySlot(target); if (g) sendG(g, { t: 'hit', by: 0 }); }
  else sendHost({ t: 'hit', target });
}

// Send my position 20x per second
const euler = new THREE.Euler();
setInterval(() => {
  if (!mode) return;
  euler.setFromQuaternion(camera.quaternion, 'YXZ');
  const p = camera.position.toArray(), y = euler.y;
  if (mode === 'host') { const msg = { t: 'p', s: 0, p, y }; for (const g of linkedGuests()) sendPos(g, msg); }
  else if (linked) { const msg = { t: 'p', p, y }; if (hostPos && hostPos.open) hostPos.send(msg); else sendHost(msg); }
}, 50);

// ---------- Loop ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const STEPS = 5; // small sub-steps keep you from tunneling through thin walls
  const dt = Math.min(clock.getDelta(), 0.05) / STEPS;
  for (let i = 0; i < STEPS; i++) { playerInput(dt); updatePlayer(dt); }
  if (camera.position.y < -25) spawn(); // fell off the level
  updateReload();
  for (const [s, a] of avatars) {
    a.group.visible = present[s] && a.seen;
    a.group.position.lerp(a.target, 0.25);
    a.group.rotation.y = a.yaw;
  }
  renderer.render(scene, camera);
});
</script>
</body>
